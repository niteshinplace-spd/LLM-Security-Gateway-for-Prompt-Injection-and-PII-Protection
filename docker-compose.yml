services:

  # Rust-Native Sub-Millisecond LLM Security Gateway
  rustguard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rustguard-gateway
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8080
      - UPSTREAM_BASE_URL=http://host.docker.internal:11434
      - DEFAULT_MODEL=llama3.2:1b
      - REQUIRE_AUTH=false
      - GOVERNANCE_DEFAULT_DENY=false
      - RAG_ENABLED=false
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - gateway-net

  # Optional Prometheus scraper for telemetry
  prometheus:
    image: prom/prometheus:latest
    container_name: rustguard-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - rustguard
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge
